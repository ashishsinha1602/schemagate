# CodeQL: static analysis on every push, and weekly.
#
# The tests in this repository check that schemagate does the right thing.
# This checks for the class of mistake tests do not reach -- a path that
# reaches a database with a string it built itself, a subprocess assembled
# from a caller's input, a comparison that is not constant-time where it
# should be.
#
# It matters more here than in most libraries because the thing being handled
# is an access-control decision and a SQLAlchemy URL with a password in it.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze python
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: python
          # security-extended adds the checks that are worth a false positive
          # or two in something people point at their production database.
          queries: security-extended

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:python"
