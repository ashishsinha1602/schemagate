name: fuzz
# ClusterFuzzLite on every pull request that touches the code or the
# harnesses: fuzz/fuzz_run_query_scope.py asserts that no SQL run_query lets
# through returns a withheld value, with execution as the oracle.
on:
  pull_request:
    paths: ["src/**", "fuzz/**", ".clusterfuzzlite/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pr:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address
          output-sarif: true
