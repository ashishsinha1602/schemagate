# Build the release image on any PR that changes it, without pushing. Until this existed only
# publish.yml built the image, so a base-image bump (#230, Python 3.15) passed every PR check and
# failed at release time: pyodbc had no 3.15 wheel and the slim image has no compiler.
name: docker-build
on:
  pull_request:
    paths:
      - Dockerfile
      - docker/**
      - pyproject.toml
      - .github/workflows/docker-build.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          # both platforms the release publishes: a wheel can exist for one and not the other
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
