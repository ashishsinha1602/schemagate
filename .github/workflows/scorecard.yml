# OpenSSF Scorecard: an outside audit of this repository's supply chain.
#
# A library whose pitch is "the model never sees a table the caller may not
# read" is asking to be trusted with an access-control decision. That is a
# claim about the code *and* about how the code reaches you -- who can push
# to it, whether releases are built from what is in the repository, whether
# a dependency can be swapped underneath it.
#
# Scorecard checks the second half, from outside, on a schedule, and publishes
# the result whether it is flattering or not. It is the same discipline as
# BENCHMARKS.md: a number somebody else computes is worth more than one I do.
name: scorecard
on:
  # A change to branch protection can move the score without a commit.
  branch_protection_rule:
  schedule:
    - cron: "20 7 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # upload the result to code scanning
      security-events: write
      # publish to the OpenSSF API, which is what makes the badge work
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scorecard reads the repository, it does not need to write to it;
          # a checkout that keeps credentials is itself a finding.
          persist-credentials: false

      # v2.4.0 and earlier pull from gcr.io, which now answers
      # "This API method requires billing to be enabled" on OpenSSF's own
      # project -- the first run of this workflow died on it. v2.4.3 moved
      # the image to ghcr.io.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Public, so the badge and the detail behind it are readable by
          # anyone deciding whether to install this.
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
