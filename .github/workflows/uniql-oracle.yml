# schemagate on UniQL's Oracle dialect. A push runs mode=dry: load BIRD dev into Oracle Free with UniQL's
# loader, run every gold query, then put the gold SQL through the runner and UniQL's evaluator as if it
# were a prediction -- no model is called. mode=full (manual only) calls Gemini 2.5 Flash on OCI.
name: uniql-oracle
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry (no model) or full (Gemini 2.5 Flash on OCI, paid)"
        default: dry
      limit:
        description: "only the first N questions (0 = all 1,534)"
        default: "0"
  push:
    branches: [bench/uniql-oracle]

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          # Throwaway: one job long, runner loopback only. Not a credential.
          ORACLE_PASSWORD: "Sg_CI_throwaway_2026"
        ports: ["1521:1521"]
        options: --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 60
    env:
      MODE: ${{ github.event.inputs.mode || 'dry' }}
      LIMIT: ${{ github.event.inputs.limit || '0' }}
      UNIQL_SHA: dec96c9dc15e1e6a7c075ba6771e59de86a79b43
      UNIQL_ORACLE_DSN: "localhost:1521/FREEPDB1"
      UNIQL_ORACLE_ADMIN_USER: "SYSTEM"
      UNIQL_ORACLE_ADMIN_PASSWORD: "Sg_CI_throwaway_2026"
      UNIQL_ORACLE_USER_PASSWORD: "Sg_CI_throwaway_2026"
      UNIQL_ORACLE_PASSWORD: "Sg_CI_throwaway_2026"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: UniQL and BIRD dev databases
        run: |
          set -euo pipefail
          # pinned: UniQL's 2026-11-12 release (PR #4) -- requoted Oracle gold, new loader and evaluator
          git init -q uniql && git -C uniql fetch -q --depth 1 https://github.com/JerryGao818/UniQL.git "$UNIQL_SHA"
          git -C uniql checkout -q FETCH_HEAD
          git -C uniql log -1 --format='UniQL %H %cs'
          # BIRD's official dev release (dev_20240627). UniQL's loader checks each database's SHA-256
          # against it, and minidev's copies differ.
          curl -fsSL -o dev.zip https://bird-bench.oss-cn-beijing.aliyuncs.com/dev.zip
          unzip -q dev.zip 'dev_20240627/dev_databases.zip'
          mkdir -p bird_dev && unzip -q dev_20240627/dev_databases.zip -d bird_dev -x '__MACOSX/*'
          ls bird_dev/dev_databases
      # hash-pinned like every other workflow; the -oci lock adds the OCI SDK, needed for MODE=full only
      - run: |
          set -euo pipefail
          lock=.github/requirements/uniql-oracle.txt
          if [ "$MODE" = "full" ]; then lock=.github/requirements/uniql-oracle-oci.txt; fi
          pip install --require-hashes -r "$lock" && pip install --no-deps -e .
      # UniQL's evaluator opens fresh connections per question; with the image's default process limit the
      # listener started refusing them (ORA-12516) and 170 dry-run questions were never executed.
      - name: room for the evaluator's connections
        run: |
          set -euo pipefail
          id=${{ job.services.oracle.id }}
          docker exec "$id" bash -c "printf 'alter system set processes=1000 scope=spfile;\nexit\n' | sqlplus -s / as sysdba"
          docker restart "$id" >/dev/null
          for i in $(seq 1 90); do docker exec "$id" healthcheck.sh >/dev/null 2>&1 && break; sleep 5; done
          docker exec "$id" bash -c "printf 'show parameter processes\nexit\n' | sqlplus -s / as sysdba"
      - name: load all 11 databases with UniQL's loader
        env:
          UNIQL_BIRD_DB_ROOT: ${{ github.workspace }}/bird_dev/dev_databases
        run: |
          set -euo pipefail
          cd uniql/migration/oracle
          # All 11 databases, original quoted names, ordinary users. UniQL's loader as published, on
          # python-oracledb 3.4.2 (with 26.x thin, posts.Body failed with ORA-01461 and postHistory read back
          # a different fingerprint on each run). One patch: a table whose readback fingerprint differs is
          # logged, not fatal; gold and prediction both run against the same loaded data.
          python - <<'PY'
          import pathlib
          p = pathlib.Path("loader_native.py")
          t = p.read_text()
          for old, new in (
              ("raise RuntimeError('Full strict verification failed for '",
               "print('VERIFY-MISMATCH ' + db_id + '.' + table['name'] + ': expected '"
               " + json.dumps(expected.evidence()) + ', actual ' + json.dumps(actual.evidence()),"
               " flush=True) or print('Full strict verification failed for '"),):
              assert t.count(old) == 1, "loader changed; revisit this patch: " + old
              t = t.replace(old, new)
          p.write_text(t)
          PY
          python insert_to_oracle.py --root "$UNIQL_BIRD_DB_ROOT" > load.log 2>&1 || { tail -30 load.log; exit 1; }
          grep -c content_verified load.log; grep VERIFY-MISMATCH load.log || echo "every table verified"
      - run: python benchmarks/uniql_oracle_check.py uniql/data/queries/oracle.json
      - name: OCI credentials (full mode only)
        if: env.MODE == 'full'
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          mkdir -p ~/.oci
          # secrets were saved from Windows: drop a byte-order mark and carriage returns
          printf '%s\n' "$OCI_KEY" | sed '1s/^\xEF\xBB\xBF//; s/\r$//' > ~/.oci/key.pem && chmod 600 ~/.oci/key.pem
          printf '%s\n' "$OCI_CONFIG" | sed '1s/^\xEF\xBB\xBF//; s/\r$//' \
            | sed "s|^key_file\s*=.*|key_file=$HOME/.oci/key.pem|" > ~/.oci/config
          head -1 ~/.oci/config; grep -c '=' ~/.oci/config
      - name: schemagate writes the SQL
        run: |
          extra=""; [ "$MODE" = "dry" ] && extra="--dry-run"
          python benchmarks/uniql_oracle.py --queries uniql/data/queries/oracle.json \
            --bird-db-root bird_dev/dev_databases --out out/oracle_${MODE}.json --limit "$LIMIT" $extra
      - name: UniQL's evaluator
        run: |
          cd uniql/evaluation
          python evaluate.py --predicted_sql_path ../../out/oracle_${MODE}.json --dialect oracle \
            --db_root_path ../../bird_dev/dev_databases --num_cpus 1 \
            --model "schemagate-${MODE}" --output_dir ../../out/eval 2>&1 | tail -40
      - name: score again what the database refused to connect for
        run: |
          python benchmarks/uniql_oracle_rescore.py --predictions out/oracle_${MODE}.json \
            --results out/eval/schemagate-${MODE}/oracle_schemagate-${MODE}.json \
            --uniql uniql --db-root bird_dev/dev_databases --model "schemagate-${MODE}" \
            --out out/eval/oracle_${MODE}_final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: uniql-oracle-${{ env.MODE }}
          path: out/
