# SQL Server, against a real one.
#
# The dialect module was written from the documentation for `sys.schemas`,
# `sys.columns` and `sys.types`, and the machine it was written on could not
# spare the memory the image wants. Documentation is not a run. This job is
# the run: a real SQL Server 2022, the fixture the live test builds, and
# `schemagate certify` on top of it.
name: mssql
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Throwaway. This container exists for the length of one job, listens
          # only on the runner's loopback, and is destroyed with it. It is not
          # a credential and must never be reused anywhere that is.
          MSSQL_SA_PASSWORD: "Sg_CI_throwaway_2026!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
    env:
      # `TrustServerCertificate` because the container serves a self-signed
      # cert; Driver 18 defaults to Encrypt=yes and would otherwise refuse.
      SCHEMAGATE_MSSQL_URL: "mssql+pyodbc://sa:Sg_CI_throwaway_2026!@127.0.0.1:1433/master?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ODBC Driver 18
        # Present on the hosted image most of the time, and installing it is
        # cheap; a job that silently skipped because the driver was missing
        # would be the same false green this whole exercise is about.
        run: |
          set -euo pipefail
          if ! odbcinst -q -d | grep -qi "ODBC Driver 18 for SQL Server"; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
              | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            source /etc/os-release
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/prod.list" \
              | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
            sudo sed -i 's|^deb |deb [signed-by=/usr/share/keyrings/microsoft-prod.gpg] |' \
              /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update -qq
            sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
          fi
          odbcinst -q -d

      - run: pip install -e ".[dev]" pyodbc

      - name: wait for the server to accept connections
        # The image reports healthy before the database is up, and 2022 no
        # longer ships sqlcmd to ask it properly, so ask the way the tests
        # will: open a connection and run a statement.
        run: |
          python - <<'PY'
          import os, sys, time
          import sqlalchemy as sa
          url = os.environ["SCHEMAGATE_MSSQL_URL"]
          last = None
          for attempt in range(60):
              try:
                  with sa.create_engine(url).connect() as c:
                      print(c.exec_driver_sql("SELECT @@VERSION").scalar())
                  sys.exit(0)
              except Exception as e:          # noqa: BLE001
                  last = e
                  time.sleep(2)
          print(f"never came up: {type(last).__name__}: {last}", file=sys.stderr)
          sys.exit(1)
          PY

      - name: dialect hooks against the live server
        run: pytest tests/test_dialect_mssql_live.py -v

      - name: the tests must not have skipped
        # A skip here reads as a pass in the checks list. The module skips
        # itself when SCHEMAGATE_MSSQL_URL is unset, which is exactly the
        # failure this job exists to rule out.
        run: |
          pytest tests/test_dialect_mssql_live.py -q 2>&1 | tee /tmp/out.txt
          grep -qE "[0-9]+ passed" /tmp/out.txt
          if grep -qE "[0-9]+ skipped" /tmp/out.txt; then
            echo "::error::the live SQL Server tests skipped -- nothing was verified"
            exit 1
          fi

      - name: schemagate certify
        # The same command the README tells a user to run, on the same server.
        run: python scripts/certify_dialect.py "$SCHEMAGATE_MSSQL_URL"
