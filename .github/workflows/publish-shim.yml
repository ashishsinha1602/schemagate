name: publish-shim
# One-off: publishes the 'ashiq' compatibility package that forwards to
# schemagate. Run by hand from the Actions tab; never on a tag.
on:
  workflow_dispatch:
# Least privilege by default: a job that needs to write says so itself.
permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write, contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.11"}
      - run: pip install --require-hashes -r .github/requirements/build.txt && python -m build shim/ashiq
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with: {packages-dir: shim/ashiq/dist}
