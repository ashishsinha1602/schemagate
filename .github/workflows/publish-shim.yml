name: publish-shim
# One-off: publishes the 'ashiq' compatibility package that forwards to
# schemagate. Run by hand from the Actions tab; never on a tag.
on:
  workflow_dispatch:
# Least privilege by default: a job that needs to write says so itself.
permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write, contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - run: pip install build && python -m build shim/ashiq
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with: {packages-dir: shim/ashiq/dist}
