name: ci
on: [push, pull_request]
# Least privilege by default: a job that needs to write says so itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: no restricted identifiers
        env:
          NAMECHECK_TERMS: ${{ secrets.NAMECHECK_TERMS }}
        run: python scripts/check_names.py
      - run: pip install -e ".[dev]"
      - name: tests
        env:
          # the name guard also runs as a test, so it needs the same terms
          NAMECHECK_TERMS: ${{ secrets.NAMECHECK_TERMS }}
        run: pytest -q
      - name: benchmark gate
        # fails if recall drops on either schema, or token savings regress
        run: python tests/bench.py

  reuse:
    # Every file carries machine-readable copyright and licence information
    # (REUSE.toml, LICENSES/). Fails if a new file is added without it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  lint:
    # The coding standard is PEP 8 errors plus pyflakes, configured under
    # [tool.ruff] in pyproject.toml; CONTRIBUTING.md says so. Version pinned
    # so a new ruff release cannot fail a pull request that changed nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - name: ruff
        run: ruff check .

  live-models:
    # The provider tests against a real model. They skip without a key, so
    # the matrix above never runs them; this job does, on main only, with the
    # key held in the `live-models` environment (protected branches only, so
    # a pull request from a fork never sees it). A few dozen short calls.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: live-models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,ai]"
      - name: provider tests against a real model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCHEMAGATE_HOME: ${{ runner.temp }}/schemagate-home
        run: |
          set -euo pipefail
          pytest tests/test_providers_live.py -q -m live -rs | tee live.txt
          if ! grep -qE "[0-9]+ passed" live.txt; then
            echo "::error::no live provider test ran -- is ANTHROPIC_API_KEY set in the live-models environment?"
            exit 1
          fi

  langchain-floor:
    # tests/test_langchain.py already runs in the matrix above -- but against
    # whatever langchain-core pip resolves to on the day (1.6.6 right now).
    # pyproject.toml declares `langchain-core>=0.3`, and nothing ever checked
    # the bottom of that range, so the promise was untested: anyone holding a
    # pinned 0.3.x would have found out for us. This job pins the floor.
    #
    # It does not replace the matrix run. The matrix covers the newest
    # langchain-core; this covers the oldest we claim to support. Between them
    # the declared range has both ends held down.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: pin langchain-core to the declared floor
        run: pip install 'langchain-core==0.3.*'
      - name: the floor is what actually got installed
        # without this the job passes vacuously if the pin ever stops taking
        # effect, which is the one way a version-floor test can lie.
        run: |
          python - <<'PY'
          import sys, langchain_core
          v = langchain_core.__version__
          print("langchain-core", v)
          if not v.startswith("0.3."):
              sys.exit(f"::error::expected the 0.3 floor, got {v} -- the pin did not take")
          PY
      - name: adapter tests against the floor
        run: pytest tests/test_langchain.py -q
