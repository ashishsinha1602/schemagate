name: ci
on: [push, pull_request]
# Least privilege by default: a job that needs to write says so itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: no restricted identifiers
        env:
          NAMECHECK_TERMS: ${{ secrets.NAMECHECK_TERMS }}
        run: python scripts/check_names.py
      - run: pip install -e ".[dev]"
      - name: tests
        env:
          # the name guard also runs as a test, so it needs the same terms
          NAMECHECK_TERMS: ${{ secrets.NAMECHECK_TERMS }}
        run: pytest -q
      - name: benchmark gate
        # fails if recall drops on either schema, or token savings regress
        run: python tests/bench.py
