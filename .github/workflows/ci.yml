name: ci
on: [push, pull_request]
# Least privilege by default: a job that needs to write says so itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: no restricted identifiers
        env:
          NAMECHECK_TERMS: ${{ secrets.NAMECHECK_TERMS }}
        run: python scripts/check_names.py
      - run: pip install -e ".[dev]"
      - name: tests
        env:
          # the name guard also runs as a test, so it needs the same terms
          NAMECHECK_TERMS: ${{ secrets.NAMECHECK_TERMS }}
        run: pytest -q
      - name: benchmark gate
        # fails if recall drops on either schema, or token savings regress
        run: python tests/bench.py
