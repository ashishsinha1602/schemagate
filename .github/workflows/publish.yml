name: publish
on:
  release:
    types: [published]
  # Re-attach the stack zip to an existing release when only that job
  # failed (cosign's flags changed under v4.1.2 of the installer once).
  # Only oci-stack runs on dispatch; nothing is re-published to PyPI.
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag to attach the OCI stack zip to, e.g. v0.1.58'
        required: true
        type: string
# Least privilege by default: a job that needs to write says so itself.
permissions:
  contents: read

jobs:
  pypi:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing: no API token stored anywhere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.11"}
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  oci-stack:
    # The "Deploy to Oracle Cloud" button hands Resource Manager a zip URL, and
    # RM expects the .tf files at the ZIP ROOT -- a repo source archive nests
    # everything under a folder, so build a dedicated one and attach it to the
    # release. No Marketplace listing and no partner membership involved.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # keyless Sigstore signing: the OIDC token is the identity, no key stored
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build the stack zip with the terraform at the root
        run: |
          cd oci/stack
          zip -r "$GITHUB_WORKSPACE/schemagate-oci-stack.zip" . -x '*.DS_Store'
          unzip -l "$GITHUB_WORKSPACE/schemagate-oci-stack.zip"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign the zip (keyless, Sigstore)
        # The PyPI wheels carry PEP 740 attestations; this gives the GitHub
        # release asset the same property. Anyone can check it:
        #   cosign verify-blob --bundle schemagate-oci-stack.zip.sigstore.json
        #     --certificate-identity-regexp 'github.com/ashishsinha1602/schemagate'
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
        #     schemagate-oci-stack.zip
        run: |
          # cosign 3 writes one Sigstore bundle (signature, certificate and
          # transparency-log entry together); the split .sig/.pem flags are gone.
          cosign sign-blob --yes \
            --bundle schemagate-oci-stack.zip.sigstore.json \
            schemagate-oci-stack.zip
          cosign verify-blob --bundle schemagate-oci-stack.zip.sigstore.json \
            --certificate-identity-regexp 'github.com/ashishsinha1602/schemagate' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            schemagate-oci-stack.zip
      - name: attach it to the release, with its signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag }}" \
            schemagate-oci-stack.zip schemagate-oci-stack.zip.sigstore.json --clobber

  terraform-registry:
    if: github.event_name == 'release'
    # The Registry module is a copy of oci/stack in a repo named the way the
    # Registry insists on (terraform-oci-<name>). It was synced by hand and
    # last at 0.1.45 while everything else moved on -- so the module people
    # actually pulled pinned a version eight releases old. This keeps the copy
    # current: same files, same tag, every release.
    #
    # Needs TF_MIRROR_TOKEN: a fine-grained token with contents:write on
    # ashishsinha1602/terraform-oci-schemagate-mcp. Without it, say so and
    # pass; a release must not fail because a mirror was unreachable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: sync the stack into the Registry mirror and tag it
        env:
          TOKEN: ${{ secrets.TF_MIRROR_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          MIRROR: ashishsinha1602/terraform-oci-schemagate-mcp
        run: |
          if [ -z "$TOKEN" ]; then
            echo "TF_MIRROR_TOKEN is not set; the Registry mirror was not updated." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::TF_MIRROR_TOKEN not set -- Registry mirror left at its previous version"
            exit 0
          fi
          git clone --quiet "https://x-access-token:${TOKEN}@github.com/${MIRROR}" mirror
          cp oci/stack/*.tf oci/stack/cloud-init.yaml oci/stack/schema.yaml mirror/
          cd mirror
          git config user.name  "schemagate release"
          git config user.email "noreply@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "mirror already matches oci/stack"
          else
            git commit --quiet -m "${TAG}: sync from schemagate oci/stack"
          fi
          git tag -f "$TAG"
          git push --quiet origin HEAD:main
          git push --quiet --force origin "refs/tags/$TAG"
          echo "Registry mirror synced and tagged ${TAG}: https://registry.terraform.io/modules/ashishsinha1602/schemagate/oci" >> "$GITHUB_STEP_SUMMARY"

  docker:
    if: github.event_name == 'release'
    # Published to GHCR rather than Docker Hub: no extra account, no rate
    # limit on pulls for anyone inside GitHub's network, and the token the
    # workflow already has is enough to push. `docker run ghcr.io/<owner>/
    # schemagate` is the shortest path from "heard about it" to "looking at
    # my own schema" -- shorter than pip, because it skips the question of
    # which extra a given database needs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # arm64 as well as amd64: an Apple laptop is the single most likely
          # machine someone tries this on, and an amd64-only image runs there
          # under emulation slowly enough to look broken.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/schemagate:${{ github.event.release.tag_name }}
            ghcr.io/${{ steps.owner.outputs.name }}/schemagate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: say where it went
        run: |
          echo "pushed ghcr.io/${{ steps.owner.outputs.name }}/schemagate:${{ github.event.release.tag_name }}" >> "$GITHUB_STEP_SUMMARY"

  # The MCP Registry (registry.modelcontextprotocol.io). server.json was a
  # manifest with nothing publishing it, and it had drifted five schema
  # versions behind -- a publish would have failed validation and nothing
  # would have said so. This job runs it, after PyPI, because the registry
  # proves we own the `schemagate` package by finding
  # `mcp-name: io.github.ashishsinha1602/schemagate` in the README that PyPI
  # serves -- so the release has to be on PyPI first, and visibly so.
  #
  # OIDC, not a stored token: the io.github.* namespace is authenticated by
  # this repository's identity, which is the whole reason nobody has to mint
  # or rotate anything.
  mcp-registry:
    if: github.event_name == 'release'
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: wait until PyPI serves this release
        # The registry fetches the package README from pypi.org at publish
        # time. Right after upload PyPI can lag by a minute; publishing into
        # that window fails the ownership check with a message that looks
        # like a wrong server name. So: poll, and fail loudly if it never
        # appears, rather than let the registry step fail obliquely.
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 24); do
            have="$(curl -fsS https://pypi.org/pypi/schemagate/json | python3 -c 'import sys,json;print(json.load(sys.stdin)["info"]["version"])' 2>/dev/null || true)"
            [ "$have" = "$want" ] && { echo "PyPI serves $have"; exit 0; }
            sleep 5
          done
          echo "::error::PyPI never served $want (last saw '${have:-nothing}'); the registry cannot verify ownership"
          exit 1

      - name: the README PyPI serves carries the ownership marker
        # Same check the registry makes, done here first so a missing marker
        # is a clear failure and not a rejected publish.
        run: |
          set -euo pipefail
          curl -fsS https://pypi.org/pypi/schemagate/json \
            | python3 -c 'import sys,json; d=json.load(sys.stdin)["info"]["description"]; sys.exit(0 if "mcp-name: io.github.ashishsinha1602/schemagate" in d else 1)' \
            || { echo "::error::the published README has no mcp-name marker; the registry will refuse ownership"; exit 1; }

      - name: install mcp-publisher
        run: |
          # A fixed version and its published checksum, not "latest" piped
          # straight into tar: the tool that publishes this project's registry
          # entry should not be whatever a release page happened to hold today.
          V=1.8.1
          SHA=a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
          curl -fsSL -o mcp-publisher.tar.gz             "https://github.com/modelcontextprotocol/registry/releases/download/v${V}/mcp-publisher_linux_amd64.tar.gz"
          echo "${SHA}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: server.json version matches the release
        # tests/test_server_json.py pins it to pyproject; this is the same
        # check against the tag actually being published.
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          have="$(python3 -c 'import json;print(json.load(open("server.json"))["version"])')"
          [ "$have" = "$want" ] || { echo "::error::server.json says $have, release is $want"; exit 1; }

      - name: authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: publish to the MCP Registry
        run: ./mcp-publisher publish

      - name: say where it went
        run: |
          echo "published io.github.ashishsinha1602/schemagate ${GITHUB_REF_NAME#v} to registry.modelcontextprotocol.io" >> "$GITHUB_STEP_SUMMARY"
