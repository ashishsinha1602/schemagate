# Actions are pinned to commit SHAs, which is the right default and also means
# a pinned action never updates itself. Dependabot is what keeps a pin from
# quietly becoming a stale pin with a known CVE in it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      # One PR a week rather than one per action; these move together and
      # reviewing them separately is how they stop being reviewed at all.
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    # The runtime dependency is SQLAlchemy and nothing else, deliberately.
    # Everything else here is a test or build tool, so they can travel together.
    groups:
      dev:
        patterns: ["*"]
        exclude-patterns: ["SQLAlchemy"]

  # The hash-pinned installs CI and the image read (scripts/lock_ci.py writes
  # them). A pin by hash never moves by itself, so this is what keeps it current.
  - package-ecosystem: pip
    directories: ["/.github/requirements", "/docker"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      locks:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
