# Actions are pinned to commit SHAs, which is the right default and also means
# a pinned action never updates itself. Dependabot is what keeps a pin from
# quietly becoming a stale pin with a known CVE in it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      # One PR a week rather than one per action; these move together and
      # reviewing them separately is how they stop being reviewed at all.
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    # the locks below are regenerated by scripts/lock_ci.py, not edited by hand
    # or by Dependabot (see the note further down); without this the "/" entry
    # reaches into docker/requirements.txt too (#125)
    exclude-paths: [".github/requirements/**", "docker/**", ".clusterfuzzlite/**"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    # The runtime dependency is SQLAlchemy and nothing else, deliberately.
    # Everything else here is a test or build tool, so they can travel together.
    groups:
      dev:
        patterns: ["*"]
        exclude-patterns: ["SQLAlchemy"]

  # Not the hash-pinned locks in .github/requirements and docker/: they are
  # resolved for every Python from 3.9 with environment markers, which
  # Dependabot cannot regenerate (its first attempt, #127, left conflicting
  # pins, unpinned lines and langchain-core 1.x in the 0.3 floor lock).
  # scripts/lock_ci.py regenerates them; Scorecard's Vulnerabilities check
  # flags a pin that has gone stale.

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
